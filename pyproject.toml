[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mura-flash"
version = "0.1.0"
description = "Inspection-only host tooling for Mura target headsets"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Mura contributors" }]
dependencies = ["jsonschema>=4.25,<5"]

[project.scripts]
mura-flash = "mura_flash.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=8.4,<9",
  "ruff>=0.13,<1",
  "types-jsonschema>=4.25",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mura_flash"]

[tool.hatch.build.targets.wheel.force-include]
"contracts" = "mura_flash/data/contracts"
"recipes" = "mura_flash/data/recipes"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests/python"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["mura_flash"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests/python"]
exclude = ["tools/generate_catalog.py"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
